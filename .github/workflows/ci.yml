name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: go test ./cmd/... ./internal/...
      - run: go build ./cmd/...
