name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: 1.26.5

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Validate native installer and packaging shell
        shell: bash
        run: |
          set -euo pipefail
          sh -n scripts/install.sh
          bash -n scripts/*.sh packaging/*.sh
          node --check plugins/workload-hermes/prepare-credentials.mjs
          node --check scripts/configure-plugin-credentials.mjs
          node --check scripts/initialize-target-policy.mjs
          python3 -c 'import ast, pathlib; ast.parse(pathlib.Path("plugins/workload-hermes/ops-healthcheck.py").read_text())'
      - run: go vet ./cmd/... ./internal/...
      - run: go test -race ./internal/...
      - run: go build ./cmd/...
      - run: git diff --check
