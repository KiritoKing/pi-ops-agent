name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  GO_VERSION: 1.26.5
  NODE_VERSION: 22.23.2

jobs:
  ci-release-gates:
    uses: ./.github/workflows/ci.yml

  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: Verify tag and manifests use the package version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p 'require("./package.json").version')"
          test "${version}" = "${package_version}"
          lock_version="$(node -p 'require("./package-lock.json").packages[""].version')"
          test "${version}" = "${lock_version}"
          NODE_VERSION="${NODE_VERSION}" node <<'NODE'
          const packageDocument = require("./package.json");
          const match = /^>=(\d+)\.(\d+)\.(\d+)$/u.exec(packageDocument.engines?.node ?? "");
          if (match === null) throw new Error("package engines.node must be one exact minimum");
          const minimum = match.slice(1).map(Number);
          const runtime = process.env.NODE_VERSION.split(".").map(Number);
          for (let index = 0; index < 3; index += 1) {
            if (runtime[index] > minimum[index]) break;
            if (runtime[index] < minimum[index]) throw new Error("pinned runtime is below engines.node");
          }
          for (const dependency of ["@earendil-works/pi-ai", "@earendil-works/pi-coding-agent"]) {
            if (!/^\d+\.\d+\.\d+$/u.test(packageDocument.dependencies?.[dependency] ?? "")) {
              throw new Error(`${dependency} must use an exact version`);
            }
          }
          NODE
          client_version="$(sed -n 's/^const VERSION = "\([^"]*\)";$/\1/p' src/client/index.ts)"
          test "${version}" = "${client_version}"
          for manifest in plugins/*/manifest.json; do
            plugin_version="$(node -p 'require("./'"${manifest}"'").version')"
            test "${version}" = "${plugin_version}"
          done
      - run: npm run check
      - run: npm run build
      - run: go vet ./cmd/... ./internal/...
      - run: go test -race ./internal/...
      - run: git diff --check

  adapter-linux-runtime:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - run: npm run build
      - name: Install the real Adapter sandbox dependency
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            apparmor apparmor-profiles bubblewrap coreutils diffutils grep \
            util-linux
      - name: Load the distribution nested-bubblewrap AppArmor policy
        shell: bash
        run: |
          set -euo pipefail
          restriction_path=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          test -r "${restriction_path}"
          test "$(<"${restriction_path}")" = 1

          mapfile -t profile_sources < <(
            /usr/bin/dpkg-query --listfiles apparmor-profiles \
              | /usr/bin/awk -F/ '$NF == "bwrap-userns-restrict" { print }'
          )
          if [[ "${#profile_sources[@]}" -ne 1 ]]; then
            printf 'Expected one dpkg-owned bwrap profile, found %s\n' \
              "${#profile_sources[@]}" >&2
            exit 1
          fi
          profile_source="${profile_sources[0]}"
          test -f "${profile_source}"
          test ! -L "${profile_source}"
          test "$(/usr/bin/dpkg-query --search "${profile_source}")" \
            = "apparmor-profiles: ${profile_source}"
          package_drift="$(sudo /usr/bin/dpkg --verify apparmor-profiles)"
          test -z "${package_drift}"
          /usr/bin/grep -Fq \
            'include if exists <local/bwrap-userns-restrict>' \
            "${profile_source}"
          /usr/bin/grep -Eq '^profile bwrap /usr/bin/bwrap ' \
            "${profile_source}"
          /usr/bin/grep -Eq '^profile unpriv_bwrap ' "${profile_source}"

          profile_component="${profile_source}"
          while :; do
            test ! -L "${profile_component}"
            IFS=: read -r component_uid component_gid component_mode < <(
              /usr/bin/stat -c '%u:%g:%a' "${profile_component}"
            )
            test "${component_uid}" = 0
            test "${component_gid}" = 0
            if (( (8#${component_mode} & 0022) != 0 )); then
              printf 'Package profile path is group/world writable: %s\n' \
                "${profile_component}" >&2
              exit 1
            fi
            [[ "${profile_component}" == / ]] && break
            profile_component="$(/usr/bin/dirname -- "${profile_component}")"
          done

          local_rule="${RUNNER_TEMP}/bwrap-userns-restrict.local"
          printf '%s\n' '/usr/bin/bwrap ix,' >"${local_rule}"
          for destination in /etc/apparmor.d/bwrap-userns-restrict \
              /etc/apparmor.d/local/bwrap-userns-restrict; do
            if sudo /usr/bin/test -e "${destination}" \
                || sudo /usr/bin/test -L "${destination}"; then
              printf 'Disposable runner already has AppArmor policy path: %s\n' \
                "${destination}" >&2
              exit 1
            fi
          done
          sudo /usr/bin/install -d -o root -g root -m 0755 \
            /etc/apparmor.d/local
          sudo /usr/bin/test ! -L /etc/apparmor.d/local
          test "$(sudo /usr/bin/stat -c '%U:%G:%a' /etc/apparmor.d/local)" \
            = root:root:755
          sudo /usr/bin/install -o root -g root -m 0644 \
            "${profile_source}" /etc/apparmor.d/bwrap-userns-restrict
          sudo /usr/bin/install -o root -g root -m 0644 \
            "${local_rule}" /etc/apparmor.d/local/bwrap-userns-restrict
          sudo /usr/bin/cmp --silent \
            "${profile_source}" /etc/apparmor.d/bwrap-userns-restrict
          test "$(sudo /usr/bin/cat /etc/apparmor.d/local/bwrap-userns-restrict)" \
            = '/usr/bin/bwrap ix,'
          test "$(sudo /usr/bin/stat -c '%U:%G:%a' \
            /etc/apparmor.d/bwrap-userns-restrict)" = root:root:644
          test "$(sudo /usr/bin/stat -c '%U:%G:%a' \
            /etc/apparmor.d/local/bwrap-userns-restrict)" = root:root:644
          sudo /usr/sbin/apparmor_parser --replace \
            /etc/apparmor.d/bwrap-userns-restrict

          loaded_profiles="$(sudo /usr/bin/cat \
            /sys/kernel/security/apparmor/profiles)"
          /usr/bin/grep -Fqx 'bwrap (enforce)' <<<"${loaded_profiles}"
          /usr/bin/grep -Fqx 'unpriv_bwrap (enforce)' <<<"${loaded_profiles}"
          test "$(<"${restriction_path}")" = 1

          smoke_script="${RUNNER_TEMP}/nested-bwrap-apparmor-smoke.sh"
          cat >"${smoke_script}" <<'EOF'
          #!/bin/bash
          set -euo pipefail
          test "$$" -eq 1
          current_label="$(</proc/self/attr/current)"
          [[ "${current_label}" == *unpriv_bwrap* ]]
          for capability_set in CapInh CapPrm CapEff CapBnd CapAmb; do
            capability_value="$(/usr/bin/awk -v key="${capability_set}:" \
              '$1 == key { print $2 }' /proc/self/status)"
            [[ -n "${capability_value}" && "${capability_value}" =~ ^0+$ ]]
          done
          if /usr/bin/unshare --user --map-root-user /bin/true \
              >/dev/null 2>&1; then
            echo 'Source created a further user namespace' >&2
            exit 1
          fi
          if /usr/bin/bwrap --die-with-parent --unshare-user --uid 0 --gid 0 \
              --ro-bind / / -- /bin/true >/dev/null 2>&1; then
            echo 'Source obtained nested bubblewrap authority' >&2
            exit 1
          fi
          EOF
          /usr/bin/chmod 0755 "${smoke_script}"
          /usr/bin/bwrap \
            --die-with-parent \
            --unshare-user --unshare-ipc --unshare-pid --unshare-net \
            --cap-drop ALL --bind / / --proc /proc --dev /dev \
            -- /usr/bin/bwrap \
            --die-with-parent --new-session \
            --unshare-user --unshare-ipc --unshare-pid --unshare-net \
            --as-pid-1 --disable-userns --cap-drop ALL \
            --ro-bind / / --proc /proc --dev /dev --clearenv \
            -- /bin/bash "${smoke_script}"
          test "$(<"${restriction_path}")" = 1
      - name: Create the disposable Adapter identity fixture
        shell: bash
        run: |
          set -euo pipefail
          runner_identity="$(id -a)"
          if /usr/bin/getent passwd ops-agent-botmux >/dev/null \
            || /usr/bin/getent group ops-agent-botmux >/dev/null \
            || /usr/bin/getent group ops-agent-client >/dev/null; then
            echo "Disposable runner unexpectedly contains an ops-agent probe identity" >&2
            exit 1
          fi
          sudo /usr/sbin/groupadd --system ops-agent-client
          sudo /usr/sbin/groupadd --system ops-agent-botmux
          sudo /usr/sbin/useradd --system \
            --gid ops-agent-botmux \
            --groups ops-agent-client \
            --home-dir /var/lib/ops-agent/adapters/botmux \
            --shell /usr/sbin/nologin \
            --no-create-home \
            ops-agent-botmux
          sudo /usr/bin/install -d \
            -o ops-agent-botmux -g ops-agent-botmux -m 0700 \
            /var/lib/ops-agent/adapters/botmux
          sudo /usr/bin/install -d -o root -g root -m 0755 /opt/pi-ops-agent
          test "$(id -a)" = "${runner_identity}"
      - name: Run the release-blocking real Linux Adapter probe
        shell: bash
        run: |
          set -euo pipefail
          node_directory="$(dirname "$(command -v node)")"
          set +e
          sudo /usr/bin/env \
            "PATH=${node_directory}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            npm run test:adapter-linux-runtime
          probe_status="$?"
          set -e
          if [[ "${probe_status}" -ne 0 ]]; then
            echo "Real Linux Adapter probe failed with status ${probe_status}; status 77 is unverified and blocks release" >&2
            exit "${probe_status}"
          fi

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            node_arch: x64
          - arch: arm64
            runner: ubuntu-24.04-arm
            node_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - run: npm run build
      - run: npm prune --omit=dev --ignore-scripts
      - name: Build static Go commands
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-bin
          release_commands=(
            ops-agent-server
            ops-root-helper
            agentd-guardian
            agentd-client-gateway
            agentd-pluginctl
            agentd-approval-submit
            agentd-json-config-helper
          )
          for command_name in "${release_commands[@]}"; do
            test -f "cmd/${command_name}/main.go"
            CGO_ENABLED=0 GOOS=linux GOARCH="${{ matrix.arch }}" go build -trimpath \
              -ldflags="-s -w" \
              -o "release-bin/${command_name}" "./cmd/${command_name}"
          done
          test ! -e release-bin/ops-systemd-helper
      - name: Download and verify the pinned Node runtime
        shell: bash
        run: |
          set -euo pipefail
          node_archive="node-v${NODE_VERSION}-linux-${{ matrix.node_arch }}.tar.xz"
          node_base="https://nodejs.org/dist/v${NODE_VERSION}"
          curl -fsSLO "${node_base}/${node_archive}"
          curl -fsSLO "${node_base}/SHASUMS256.txt"
          grep " ${node_archive}$" SHASUMS256.txt | sha256sum --check --strict
          mkdir -p node-runtime
          tar -xJf "${node_archive}" --strip-components=1 -C node-runtime
          test "$(node-runtime/bin/node -p 'process.versions.node')" = "${NODE_VERSION}"
      - name: Build native archive and Debian package
        id: native_package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          packaging/build-release.sh \
            --version "${GITHUB_REF_NAME#v}" \
            --arch "${{ matrix.arch }}" \
            --node-runtime-dir node-runtime \
            --bin-dir release-bin \
            --output-dir release
          packaging/verify-release.sh \
            --version "${GITHUB_REF_NAME#v}" \
            --arch "${{ matrix.arch }}" \
            --node-version "${NODE_VERSION}" \
            --archive "release/ops-agent-linux-${{ matrix.arch }}.tar.gz" \
            --deb "release/ops-agent-all_${GITHUB_REF_NAME#v}_${{ matrix.arch }}.deb"
          mkdir -p sbom-root
          tar -xzf "release/ops-agent-linux-${{ matrix.arch }}.tar.gz" -C sbom-root
          printf 'version=%s\n' "${GITHUB_REF_NAME#v}" >>"${GITHUB_OUTPUT}"
      - name: Isolate verified native packages before SBOM generation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-packages-${{ matrix.arch }}
          path: |
            release/ops-agent-linux-${{ matrix.arch }}.tar.gz
            release/ops-agent-all_${{ steps.native_package.outputs.version }}_${{ matrix.arch }}.deb
          if-no-files-found: error
          retention-days: 7
      - name: Generate installed-payload SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: sbom-root/payload/app
          format: spdx-json
          output-file: release/ops-agent-linux-${{ matrix.arch }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Upload generated SBOM separately
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-sbom-${{ matrix.arch }}
          path: release/ops-agent-linux-${{ matrix.arch }}.spdx.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs:
      - build
      - adapter-linux-runtime
      - ci-release-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: release
          merge-multiple: true
      - name: Re-verify downloaded native packages
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            packaging/verify-release.sh \
              --version "${GITHUB_REF_NAME#v}" \
              --arch "${arch}" \
              --node-version "${NODE_VERSION}" \
              --archive "release/ops-agent-linux-${arch}.tar.gz" \
              --deb "release/ops-agent-all_${GITHUB_REF_NAME#v}_${arch}.deb" \
              --no-payload-execution
          done
      - name: Build optional first-party plugins
        shell: bash
        run: |
          set -euo pipefail
          packaging/build-botmux-plugin.sh "${GITHUB_REF_NAME#v}" release
          packaging/build-hermes-workload-plugin.sh "${GITHUB_REF_NAME#v}" release
      - name: Generate release manifest and checksums
        shell: bash
        run: |
          set -euo pipefail
          packaging/create-release-manifest.sh \
            release "${GITHUB_REF_NAME#v}" "${GITHUB_REPOSITORY}" "${GITHUB_SHA}"
          (
            cd release
            sha256sum -- * | sort -k 2 > checksums.txt
          )
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/*.deb
            release/*.tar.gz
            release/*.opspkg
            release/*.spdx.json
            release/manifest.json
            release/checksums.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            printf 'Release %s already exists; published assets are immutable.\n' "${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" release/* \
            --verify-tag --generate-notes --title "Pi Ops Agent ${GITHUB_REF_NAME}"
