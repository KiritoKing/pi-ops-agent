[Service]
SupplementaryGroups=ops-agent-client
NoNewPrivileges=yes
PrivateTmp=yes
PrivateDevices=yes
PrivateNetwork=yes
ProtectSystem=strict
ProtectHome=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
ProcSubset=pid
RestrictRealtime=yes
RestrictSUIDSGID=yes
RestrictNamespaces=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
CapabilityBoundingSet=
RestrictAddressFamilies=AF_UNIX
ReadOnlyPaths=/opt/pi-ops-agent /etc/ops-agent/agentd-guardian.json /run/ops-agent/agentd
InaccessiblePaths=-/etc/ops-agent/agentd.json -/etc/ops-agent/credentials -/etc/ops-agent/tls -/etc/ops-agent/workloads -/run/ops-agent/agentd/agentd.sock -/run/ops-agent/agentd/backend.sock -/run/ops-agent/helper -/var/lib/ops-agent -/var/log/ops-agent -/run/docker.sock -/var/run/docker.sock
