[Service]
SupplementaryGroups=ops-agent-client
TasksMax=128
LimitNOFILE=512
MemoryMax=256M
NoNewPrivileges=yes
PrivateTmp=yes
PrivateDevices=yes
PrivateNetwork=yes
ProtectSystem=strict
ProtectHome=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
ProcSubset=pid
RestrictRealtime=yes
RestrictSUIDSGID=yes
RestrictNamespaces=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
CapabilityBoundingSet=
RestrictAddressFamilies=AF_UNIX
ReadOnlyPaths=/opt/pi-ops-agent /var/lib/ops-agent/plugins
ReadWritePaths=/run/ops-agent/agentd
InaccessiblePaths=-/etc/ops-agent/credentials -/etc/ops-agent/tls -/etc/ops-agent/approver -/etc/ops-agent/broker-receipts/private -/var/lib/ops-agent/root-helper -/var/lib/ops-agent/pve-root-helper -/var/lib/ops-agent/sessions -/var/lib/ops-agent/workspaces -/var/lib/ops-agent/registry -/var/lib/ops-agent/pi -/var/log/ops-agent -/run/ops-agent/helper -/run/ops-agent/reviewer
