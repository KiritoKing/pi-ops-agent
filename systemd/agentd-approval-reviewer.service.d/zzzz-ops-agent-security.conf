[Service]
NoNewPrivileges=yes
PrivateTmp=yes
PrivateDevices=yes
PrivateNetwork=yes
ProtectSystem=strict
ProtectHome=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictRealtime=yes
RestrictSUIDSGID=yes
RestrictNamespaces=yes
LockPersonality=yes
SystemCallArchitectures=native
CapabilityBoundingSet=
RestrictAddressFamilies=AF_UNIX
ReadOnlyPaths=/opt/pi-ops-agent
ReadWritePaths=/run/ops-agent/reviewer
InaccessiblePaths=-/etc/ops-agent -/run/ops-agent/agentd -/run/ops-agent/helper -/var/lib/ops-agent -/var/log/ops-agent -/run/docker.sock -/var/run/docker.sock
