[Service]
NoNewPrivileges=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectSystem=strict
ProtectHome=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
ProcSubset=pid
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
SystemCallArchitectures=native
CapabilityBoundingSet=
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
ReadWritePaths=/run/ops-agent/agentd /var/lib/ops-agent/workspaces /var/lib/ops-agent/sessions /var/lib/ops-agent/registry /var/lib/ops-agent/machines /var/lib/ops-agent/pi /var/log/ops-agent/agentd
ReadOnlyPaths=/opt/pi-ops-agent /etc/ops-agent /run/ops-agent/helper
InaccessiblePaths=-/etc/ops-agent/workloads -/run/docker.sock -/var/run/docker.sock
